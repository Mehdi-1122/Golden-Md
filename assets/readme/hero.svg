<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-label="Golden MD, WhatsApp multi-device bot with 340 commands">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7CE"/>
      <stop offset=".42" stop-color="#FFD24A"/>
      <stop offset=".6" stop-color="#F2B52E"/>
      <stop offset="1" stop-color="#9C6E12"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#C79A2E"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="34%" r="75%">
      <stop offset="0" stop-color="#15241c"/>
      <stop offset=".55" stop-color="#0c1511"/>
      <stop offset="1" stop-color="#070a08"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ttl{ font-family:"Arial Black","Segoe UI",Arial,sans-serif; font-weight:900; }
      .lbl{ font-family:"Segoe UI",Arial,sans-serif; font-weight:700; }
      .p{ fill:#FFD24A; opacity:0; animation:rise 7s linear infinite; }
      @keyframes rise{ 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:.9; } 100%{ transform:translateY(-230px); opacity:0; } }
      .sheen{ animation:sh 3.6s ease-in-out infinite; }
      @keyframes sh{ 0%,100%{ opacity:.0; } 50%{ opacity:.55; } }
      @media (prefers-reduced-motion:reduce){ .p,.sheen{ animation:none; } }
    </style>
  </defs>

  <!-- frame -->
  <rect x="8" y="8" width="1264" height="524" rx="28" fill="url(#vig)" stroke="#FFD24A" stroke-opacity=".32" stroke-width="2"/>

  <!-- floating sparks -->
  <g>
    <circle class="p" cx="180" cy="430" r="3" style="animation-delay:0s"/>
    <circle class="p" cx="380" cy="470" r="2" style="animation-delay:1.3s"/>
    <circle class="p" cx="640" cy="480" r="3" style="animation-delay:2.1s"/>
    <circle class="p" cx="920" cy="465" r="2" style="animation-delay:.7s"/>
    <circle class="p" cx="1100" cy="440" r="3" style="animation-delay:3s"/>
    <circle class="p" cx="520" cy="455" r="2" style="animation-delay:4.1s"/>
    <circle class="p" cx="760" cy="470" r="2" style="animation-delay:5.2s"/>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="url(#goldSoft)" stroke-width="5" stroke-linecap="round">
    <path d="M44 96 L44 48 L92 48"/>
    <path d="M1236 96 L1236 48 L1188 48"/>
    <path d="M44 444 L44 492 L92 492"/>
    <path d="M1236 444 L1236 492 L1188 492"/>
  </g>

  <!-- crown -->
  <g filter="url(#glow)">
    <path d="M585 196 L602 150 L626 180 L640 138 L654 180 L678 150 L695 196 Z" fill="url(#gold)" stroke="#8a6410" stroke-width="2" stroke-linejoin="round"/>
    <rect x="585" y="198" width="110" height="12" rx="4" fill="url(#gold)" stroke="#8a6410" stroke-width="1.5"/>
    <circle cx="602" cy="150" r="6" fill="#FFF3C0"/>
    <circle cx="640" cy="138" r="7" fill="#E23B4E"/>
    <circle cx="678" cy="150" r="6" fill="#FFF3C0"/>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text class="ttl" x="640" y="330" text-anchor="middle" font-size="128" letter-spacing="4" fill="url(#gold)" stroke="#7a560e" stroke-width="1.5">GOLDEN MD</text>
    <text class="ttl sheen" x="640" y="330" text-anchor="middle" font-size="128" letter-spacing="4" fill="#FFF8E0">GOLDEN MD</text>
  </g>

  <!-- subtitle -->
  <text class="lbl" x="640" y="378" text-anchor="middle" font-size="26" letter-spacing="10" fill="#C9A24A">WHATSAPP MULTI-DEVICE BOT</text>

  <!-- commands pill -->
  <g>
    <rect x="500" y="410" width="280" height="54" rx="27" fill="#0E0A04" stroke="url(#gold)" stroke-width="2" stroke-dasharray="7 6"/>
    <text class="ttl" x="640" y="447" text-anchor="middle" font-size="27" letter-spacing="3" fill="url(#gold)">340 COMMANDS</text>
  </g>
</svg>
